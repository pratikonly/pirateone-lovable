<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PirateOne</title>
    <meta name="description" content="Streaming Website">
    <meta name="author" content="Lovable" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/pirateone-icon.png" />
    <meta property="og:title" content="PirateOne">
    <meta name="twitter:title" content="PirateOne">
    <meta property="og:description" content="Streaming Website">
    <meta name="twitter:description" content="Streaming Website">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const img = new Image();
      img.src = '/pirateone-icon.png';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        ctx.globalCompositeOperation = 'source-in';
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const link = document.querySelector("link[rel='icon']");
        link.href = canvas.toDataURL('image/png');
      };
    </script>
  </body>
</html>
