<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="http://pirateone.qzz.io/" />
    <meta name="google-site-verification" content="xaatb073JGplJEsFBVb8z-_4oAiCq2SSvIKp25jvtAM" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PirateOne — Stream Movies, TV Shows & Anime Free" />
    <meta property="og:description" content="Free streaming for movies, TV, anime and live sports. Ad-protected playback, watchlists and continue-watching built in." />

    <meta property="og:site_name" content="PirateOne" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PirateOne — Stream Movies, TV Shows & Anime Free" />
    <meta name="twitter:description" content="Free streaming for movies, TV, anime and live sports with ad-protected playback." />

    <link rel="icon" type="image/png" href="/pirateone-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PirateOne",
        "url": "http://pirateone.qzz.io/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "http://pirateone.qzz.io/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PirateOne",
        "url": "http://pirateone.qzz.io/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const img = new Image();
      img.src = '/pirateone-icon.png';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        ctx.globalCompositeOperation = 'source-in';
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const link = document.querySelector("link[rel='icon']");
        link.href = canvas.toDataURL('image/png');
      };
    </script>
  </body>
</html>
